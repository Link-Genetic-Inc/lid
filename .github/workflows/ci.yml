name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_call:
    inputs:
      ref:
        description: Exact commit or release tag to validate
        required: false
        type: string

permissions:
  contents: read

jobs:
  # ── JavaScript SDK ──────────────────────────────────────────────
  sdk-js:
    name: JS SDK (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24, 26]
    defaults:
      run:
        working-directory: sdk/js
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install dependencies
        run: npm ci --include=dev --ignore-scripts --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run type-check
      - name: Build
        run: npm run build
      - name: Test
        run: npm run test:coverage
      - name: Public resolution contract (isolated HTTP fixture)
        run: node --test ../../tests/conformance/resolution-algorithm.test.js

  # ── Python SDK ──────────────────────────────────────────────────
  sdk-python:
    name: Python SDK (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    defaults:
      run:
        working-directory: sdk/python
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov black ruff
      - name: Lint (Ruff)
        run: ruff check .
      - name: Format check (Black)
        run: black --check .
      - name: Test
        run: pytest --cov=. --cov-report=xml

  # ── Java SDK ────────────────────────────────────────────────────
  sdk-java:
    name: Java SDK (JDK ${{ matrix.java-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java-version: [17, 21, 25]
    defaults:
      run:
        working-directory: sdk/java
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Set up JDK ${{ matrix.java-version }}
        uses: actions/setup-java@v6
        with:
          java-version: ${{ matrix.java-version }}
          distribution: temurin
          cache: maven
      - name: Build and test
        run: mvn --batch-mode --update-snapshots -Dgpg.skip=true verify

  # ── Spec HTML Validation ────────────────────────────────────────
  spec-validate:
    name: Spec HTML Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Validate spec/index.html
        uses: Cyb3r-Jak3/html5validator-action@v8.0.0
        with:
          root: spec/
          css: true

  repository-checks:
    name: Documentation and release safeguards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node --test tests/repository/*.test.js
