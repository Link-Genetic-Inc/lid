name: Integration Tests

on:
  # schedule disabled — tests are stale and failing daily (LINKID-116)
  # schedule:
  #   - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      resolver_url:
        description: 'Resolver URL to test against'
        required: false
        default: 'https://linkid.io'

env:
  RESOLVER_URL: ${{ github.event.inputs.resolver_url || 'https://linkid.io' }}

jobs:
  integration-js:
    name: JS Integration Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/js
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install dependencies
        id: npm-install
        shell: bash
        run: |
          set +e
          npm ci --include=dev --ignore-scripts --no-audit --no-fund
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            log_file=$(find "$HOME/.npm/_logs" -type f -name '*-debug-0.log' -print | sort | tail -n 1)
            if [ -n "$log_file" ]; then
              grep -Eiv 'token|auth|password|username|credential|secret' "$log_file" \
                | tail -n 500 > "$RUNNER_TEMP/npm-debug-redacted.log" || true
            fi
            exit "$status"
          fi
      - name: Upload redacted npm diagnostics
        if: failure() && steps.npm-install.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: npm-debug-redacted
          path: ${{ runner.temp }}/npm-debug-redacted.log
          if-no-files-found: error
          retention-days: 1
      - name: Run integration tests
        run: npm run test:integration
        env:
          LINKID_RESOLVER: ${{ env.RESOLVER_URL }}
          LINKID_TEST_ID: linkid:b1a93fdb-ab8a-49f8-a359-33ad79e19df3
          LINKID_INTEGRATION: '1'

  integration-python:
    name: Python Integration Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: |
          pip install --upgrade pip
          pip install -e .
          pip install pytest pytest-asyncio
      - name: Run integration tests
        run: pytest tests/ -m integration -v
        env:
          LINKID_RESOLVER: ${{ env.RESOLVER_URL }}
          LINKID_TEST_ID: linkid:b1a93fdb-ab8a-49f8-a359-33ad79e19df3
          LINKID_INTEGRATION: '1'

  integration-java:
    name: Java Integration Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/java
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin
          cache: maven
      - name: Run integration tests
        run: mvn --batch-mode test -Dlinkid.integration=true
        env:
          LINKID_RESOLVER: ${{ env.RESOLVER_URL }}
          LINKID_TEST_ID: linkid:b1a93fdb-ab8a-49f8-a359-33ad79e19df3
          LINKID_INTEGRATION: '1'
