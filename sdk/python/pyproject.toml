[build-system]
requires = ["setuptools>=82.0.1", "wheel>=0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "linkid-client"
version = "1.0.1"
description = "Python client SDK for LinkID persistent identifiers"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Link Genetic GmbH", email = "info@linkgenetic.com" }]
keywords = ["linkid", "persistent-identifier", "resolver", "sdk"]
requires-python = ">=3.9"
dependencies = ["httpx>=0.28.1"]

[project.optional-dependencies]
dev = ["pytest>=8.4.2", "pytest-cov>=7.1.0", "ruff>=0.15.10", "mypy>=1.19.1"]

[project.urls]
Homepage = "https://linkgenetic.com"
Repository = "https://github.com/Link-Genetic-Inc/lid"
"Bug Tracker" = "https://github.com/Link-Genetic-Inc/lid/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["linkid*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: live unauthenticated tests against the public resolver"]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.9"
strict = true
